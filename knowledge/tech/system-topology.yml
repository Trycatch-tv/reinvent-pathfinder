# System Topology — pathfinder
#
# Evidence-backed semantic topology. Reconstructed from direct repository inspection
# (not inferred from filenames). The repository currently contains SCAFFOLDING ONLY:
# 11 pnpm workspace packages whose src files are empty placeholders (`export {};`),
# with no imports and no declared dependencies. The only evidence-backed relationship
# is `contains` (workspace membership + root tsconfig project references).
#
# Runtime architecture described in knowledge/tech/codebase.md and current-state.md
# (AWS Events, Bedrock, DynamoDB, Lambda, API Gateway, AgentCore, inter-package calls)
# is INTENT, not implemented. It is intentionally left as Unknown below and must be
# asserted only when the corresponding Work Items (INI-002, INI-003) land real code.
#
# Structure: single-repo pnpm monorepo (one git repository). Not multirepo —
# modules_discover found no sibling repositories; the repo registers itself in
# .kaddo/modules.yml with path ".".
version: 1

